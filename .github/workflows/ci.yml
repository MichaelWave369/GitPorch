name: GitPorch Public Reference and Local Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check public GitPorch browser assets
        run: |
          node --check docs/app.js
          node --check docs/clubhouse.js
      - name: Run complete GitPorch Node tests
        run: npm test
